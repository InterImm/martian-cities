name: Deploy web to GitHub Pages
on:
  push:
    branches: [master, main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node web/sim.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Phones cache pages and scripts for minutes; tie every asset URL to this commit so a new page never meets an old script.
      - name: Version asset URLs
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=$v/g" web/index.html
          sed -i -E "s#from '\./(sim|marstime|i18n)\.js'#from './\1.js?v=$v'#" web/js/main.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
